<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlens Collective // Columbia River Gorge Photography</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&family=Playfair+Display:ital@1&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0a;
            --text-color: #e0e0e0;
            --accent-color: #888;
            --grid-gap: 15px;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            padding: 60px 20px;
            text-align: center;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            color: var(--accent-color);
            font-size: 0.9rem;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Filter System */
        .filters {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .filter-btn {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .filter-btn:hover,
        .filter-btn.active {
            color: #fff;
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px 100px;
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: var(--grid-gap);
        }

        .gallery-item {
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
            aspect-ratio: 4 / 5;
            cursor: pointer;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            filter: grayscale(20%);
        }

        .gallery-item:hover img {
            transform: scale(1.05);
            filter: grayscale(0%);
        }

        .item-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.8));
            padding: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .gallery-item:hover .item-overlay {
            opacity: 1;
        }

        .item-overlay span {
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Lightbox */
        #lightbox {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #lightbox img {
            max-width: 90%;
            max-height: 80%;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }

            .gallery-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>Wildlens Collective</h1>
        <div class="subtitle">Columbia River Gorge // Oregon</div>
    </header>

    <nav class="filters">
        <button class="filter-btn active" onclick="filterGallery('all')">All</button>
        <button class="filter-btn" onclick="filterGallery('vistas')">Vistas</button>
        <button class="filter-btn" onclick="filterGallery('forest')">Forest</button>
        <button class="filter-btn" onclick="filterGallery('macro')">Macro</button>
    </nav>

    <main class="gallery-container">
        <div class="gallery-grid" id="gallery">

            <div class="gallery-item forest"
                onclick="openLightbox('photos/IMG_9912.jpg', 'The Misty Ascent // Dog Mountain')">
                <img src="photos/IMG_9912.jpg" alt="Misty forest trail" loading="lazy">
                <div class="item-overlay"><span>The Misty Ascent // Dog Mountain</span></div>
            </div>

            <div class="gallery-item vistas" onclick="openLightbox('photos/IMG_9921.jpg', 'Crown Point Overlook')">
                <img src="photos/IMG_9921.jpg" alt="Columbia River Vista" loading="lazy">
                <div class="item-overlay"><span>Crown Point // Vista House</span></div>
            </div>

            <div class="gallery-item macro" onclick="openLightbox('photos/IMG_9909.jpg', 'Basalt Textures')">
                <img src="photos/IMG_9909.jpg" alt="Lichen on basalt" loading="lazy">
                <div class="item-overlay"><span>Ancient Texture // Basalt</span></div>
            </div>

        </div>
    </main>

    <div id="lightbox" onclick="closeLightbox()">
        <span class="close-btn">&times;</span>
        <img id="lightbox-img" src="">
        <p id="lightbox-caption"
            style="position: absolute; bottom: 40px; letter-spacing: 2px; font-size: 0.8rem; color: #888;"></p>
    </div>

    <script>
        function filterGallery(category) {
            const items = document.querySelectorAll('.gallery-item');
            const btns = document.querySelectorAll('.filter-btn');

            btns.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            items.forEach(item => {
                if (category === 'all' || item.classList.contains(category)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function openLightbox(src, caption) {
            document.getElementById('lightbox-img').src = src;
            document.getElementById('lightbox-caption').innerText = caption;
            document.getElementById('lightbox').style.display = 'flex';
        }

        function closeLightbox() {
            document.getElementById('lightbox').style.display = 'none';
        }

        // Close on 'Esc' key
        document.addEventListener('keydown', (e) => {
            if (e.key === "Escape") closeLightbox();
        });
    </script>
</body>

</html>
